<title>People Frameworks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#f6f6f6;--panel:#fff;--ink:#18151f;--muted:#5c566b;--faint:#8d8698;--line:rgba(23,21,31,.10);--line-strong:rgba(23,21,31,.16);--violet:#6f4fe0;--accent:#5636c4;--rose:#c23268}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font:15px/1.5 "IBM Plex Sans","Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);display:grid;place-items:center;padding:24px;-webkit-font-smoothing:antialiased}
.card{width:min(440px,100%);background:var(--panel);border:1px solid var(--line);border-radius:26px;padding:34px 34px 30px}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:26px}
.brand img{height:34px;width:auto;display:block}
.brand span{font:500 11.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
h1{font:600 28px/1.12 "Fraunces","Iowan Old Style",Georgia,serif;letter-spacing:-.01em;margin:0 0 10px}
p{margin:0 0 20px;color:var(--muted)}
label{display:block;font:500 11px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.row{display:flex;gap:8px}
input{flex:1;min-width:0;font:inherit;color:inherit;padding:11px 18px;border:1px solid var(--line-strong);border-radius:999px;background:var(--bg)}
input:focus{background:var(--panel);outline:2px solid var(--accent);outline-offset:2px}
button{font:inherit;font-weight:600;color:#fff;background:var(--accent);border:0;border-radius:999px;padding:11px 22px;cursor:pointer}
button:hover{background:var(--violet)}
button:disabled{opacity:.6;cursor:wait}
.msg{min-height:22px;margin:12px 4px 0;font-size:13.5px;color:var(--rose)}
.msg.busy{color:var(--muted)}
.keep{display:flex;align-items:center;gap:8px;margin:14px 4px 0;font:400 13.5px "IBM Plex Sans",sans-serif;letter-spacing:0;text-transform:none;color:var(--muted);cursor:pointer}
.keep input{flex:none;width:16px;height:16px;accent-color:var(--accent)}
.card.wait{visibility:hidden}
.fine{margin:20px 0 0;font-size:12.5px;color:var(--faint)}
</style>
</head>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const f = document.getElementById("f"), code = document.getElementById("code"), go = document.getElementById("go"), msg = document.getElementById("msg");
const SK = "apf-people-frameworks-session", DAYS = 30;
const keep = document.getElementById("keep");
async function open_(key){
  const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b64(P.iv) }, key, b64(P.data));   // rejects when the key is wrong
  const stream = new Blob([plain]).stream().pipeThrough(new DecompressionStream("gzip"));
  return new Response(stream).text();
}
async function deriveKey(pass){
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pass), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({ name: "PBKDF2", salt: b64(P.salt), iterations: P.iter, hash: "SHA-256" }, km, { name: "AES-GCM", length: 256 }, true, ["decrypt"]);
}
function show(html){ document.open(); document.write(html); document.close(); }
// Signed-in browsers keep the derived key (never the code) in localStorage, for 30 days.
async function resume(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(SK) || "null"); } catch (e){}
  if (!s || !s.k || !(s.exp > Date.now())) return false;
  try { const key = await crypto.subtle.importKey("raw", b64(s.k), "AES-GCM", false, ["decrypt"]); show(await open_(key)); return true; }
  catch (e){ try { localStorage.removeItem(SK); } catch (x){} return false; }   // code changed: ask again
}
const hasCrypto = !!(window.crypto && crypto.subtle);
if (hasCrypto){ document.querySelector(".card").classList.add("wait"); resume().then(ok => { if (!ok) document.querySelector(".card").classList.remove("wait"); }); }
f.addEventListener("submit", async e => {
  e.preventDefault();
  if (!hasCrypto){ msg.className = "msg"; msg.textContent = "This browser cannot unlock the page. Open it over https in a current browser."; return; }
  go.disabled = true; msg.className = "msg busy"; msg.textContent = "Unlocking…";
  let html, key;
  try { key = await deriveKey(code.value.trim()); html = await open_(key); }
  catch (err){ go.disabled = false; msg.className = "msg"; msg.textContent = "That code did not work. Check it and try again."; code.select(); return; }
  if (keep.checked){
    try { const raw = new Uint8Array(await crypto.subtle.exportKey("raw", key)); localStorage.setItem(SK, JSON.stringify({ k: btoa(String.fromCharCode.apply(null, raw)), exp: Date.now() + DAYS * 864e5 })); } catch (err){}
  }
  show(html);
});
})();
